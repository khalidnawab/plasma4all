{% extends 'base.html' %}

{% block content %}
    <style>
    body {
        font-family: "Roboto", sans-serif;
        font-size: 18px;
        background-color: #fdfdfd;
    }

    .head_text {
        color: white;
    }

    .card {
        box-shadow: 0 16px 48px #E3E7EB;
    }
</style>

<header class="masthead">
    <div class="overlay"></div>
    <div class="container">
        <div class="row">
            <div class=" col-md-8 col-md-10 mx-auto">
                <div class="site-heading">
                    <h3 class=" site-heading my-4 mt-3 text-white"> Sign Up</h3>
                    <p class="text-light">Please fill the form to create an account.</p>
                </div>
            </div>
        </div>
    </div>
</header>
<div class="container-fluid">
<div class="col-md-6 card mb-4  mt-3 left  top">
    <p></p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
  </form>
    <p></p>
</div>
</div>
{% endblock %}
